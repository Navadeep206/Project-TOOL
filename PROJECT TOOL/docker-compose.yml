services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: project-tool-backend
    ports:
      - "5050:5050"
    env_file:
      - ./Backend/.env
    environment:
      - PORT=5050
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:5050/api
    container_name: project-tool-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
