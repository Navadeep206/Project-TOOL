version: '3.9'

services:
  backend:
    container_name: projecttool-backend
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/projecttool}
      - JWT_SECRET=${JWT_SECRET:-your-secret-key}
      - PORT=8080
    depends_on:
      - mongo
    networks:
      - projecttool-network
    restart: unless-stopped
    volumes:
      - ./Backend:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    container_name: projecttool-frontend
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - projecttool-network
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://backend:8080
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  mongo:
    container_name: projecttool-mongo
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-admin123}
      MONGO_INITDB_DATABASE: projecttool
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    networks:
      - projecttool-network
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  projecttool-network:
    driver: bridge

volumes:
  mongo_data:
  mongo_config:
